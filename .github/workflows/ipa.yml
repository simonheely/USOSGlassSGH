name: Build downloadable iPhone IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-ipa:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -version
      - name: Select simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if "iPhone" in x["name"]))')
          echo "SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
      - name: Run OAuth and data tests
        run: |
          set -o pipefail
          xcodebuild test -project USOSGlassSGH.xcodeproj -scheme USOSGlassSGH \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/TestDerived" -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | tee test.log
      - name: Capture simulator previews
        run: |
          mkdir -p previews
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl status_bar "$SIMULATOR_ID" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          xcrun simctl install "$SIMULATOR_ID" "$RUNNER_TEMP/TestDerived/Build/Products/Debug-iphonesimulator/USOSGlassSGH.app"
          xcrun simctl launch "$SIMULATOR_ID" pl.prototype.USOSGlassSGH -onboarded.v2 YES -appearance light
          sleep 3
          xcrun simctl io "$SIMULATOR_ID" screenshot previews/light.png
          xcrun simctl terminate "$SIMULATOR_ID" pl.prototype.USOSGlassSGH
          xcrun simctl launch "$SIMULATOR_ID" pl.prototype.USOSGlassSGH -onboarded.v2 YES -appearance dark
          sleep 3
          xcrun simctl io "$SIMULATOR_ID" screenshot previews/dark.png
      - uses: actions/upload-artifact@v4
        with:
          name: simulator-previews
          path: previews/
      - name: Compile iPhone app and Live Activity extension
        run: |
          set -o pipefail
          xcodebuild -project USOSGlassSGH.xcodeproj -scheme USOSGlassSGH \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tee build.log
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/USOSGlassSGH.app"
          test -d "$APP/PlugIns/CampusLiveActivity.appex"
          /usr/libexec/PlistBuddy -c 'Print NSSupportsLiveActivities' "$APP/Info.plist" | grep true
          mkdir -p "$RUNNER_TEMP/package/Payload" dist
          ditto "$APP" "$RUNNER_TEMP/package/Payload/USOSGlassSGH.app"
          (cd "$RUNNER_TEMP/package" && /usr/bin/zip -qry "$GITHUB_WORKSPACE/dist/USOSGlassSGH-unsigned.ipa" Payload)
          unzip -t dist/USOSGlassSGH-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: USOSGlassSGH-iPhone-IPA
          path: dist/USOSGlassSGH-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-diagnostics
          path: |
            *.log
            TestResults.xcresult
          retention-days: 7
