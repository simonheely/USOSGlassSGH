name: USOSGlassSGH
options:
  bundleIdPrefix: pl.prototype
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 2
    MARKETING_VERSION: 0.2.0
    TARGETED_DEVICE_FAMILY: '1'
targets:
  USOSGlassSGH:
    type: application
    platform: iOS
    sources: [USOSGlassSGH, Shared]
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: USOS Glass
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: pl.prototype.USOSGlassSGH
            CFBundleURLSchemes: [usosglass]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.prototype.USOSGlassSGH
    dependencies:
      - target: CampusLiveActivity
        embed: true
  CampusLiveActivity:
    type: app-extension
    platform: iOS
    sources: [LiveActivity, Shared]
    info:
      path: Config/Widget-Info.plist
      properties:
        CFBundleDisplayName: Zajęcia SGH
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.prototype.USOSGlassSGH.LiveActivity
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  CampusTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: USOSGlassSGH
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  USOSGlassSGH:
    build:
      targets:
        USOSGlassSGH: all
    test:
      targets: [CampusTests]
